name: BioTwin verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: biotwin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: biotwin_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: npm ci --prefix frontend
      - run: bash scripts/check_schema.sh
      - run: uv run ruff check core ingestion modeling narration shared tests scripts
      - run: uv run pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:biotwin_test@localhost:5432/biotwin
      - run: npm run test --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Verify browser and offline behavior
        run: |
          .venv/bin/uvicorn core.api:app --host 127.0.0.1 --port 8000 --no-access-log &
          biotwin_server_pid=$!
          cleanup() {
            kill "$biotwin_server_pid" 2>/dev/null || true
            wait "$biotwin_server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do curl -fsS http://localhost:8000/healthz && break || sleep 1; done
          curl -fsS http://localhost:8000/healthz
          node scripts/browser-check.mjs
          node scripts/voice-check.mjs
          node scripts/account-check.mjs
          node scripts/calendar-check.mjs
        env:
          BIOTWIN_TEST_BUNDLED_CHROMIUM: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
