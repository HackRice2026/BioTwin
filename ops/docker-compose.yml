services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: biotwin
      POSTGRES_USER: biotwin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biotwin -d biotwin"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  app:
    build:
      context: ..
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://biotwin:${POSTGRES_PASSWORD}@database:5432/biotwin
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
